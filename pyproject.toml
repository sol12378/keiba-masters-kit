[project]
name = "pykeiba"
version = "0.1.0"
description = "Model building and vote planning for keiba-masters-kit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryuichi Sato" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/sol12378/keiba-masters-kit"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pykeiba"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
